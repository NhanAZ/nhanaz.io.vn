name: Generate article audio

on:
  push:
    branches: ["main"]
    paths:
      - "posts/**"
      - "en/posts/**"
      - "scripts/article-audio.json"
      - "scripts/article-audio.mjs"
      - "scripts/build-article-audio.py"
      - "scripts/audio-requirements.txt"
      - ".github/workflows/article-audio.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: article-audio-main
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'NhanAZ/nhanaz.io.vn' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/audio-requirements.txt
      - name: Check whether recordings need to change
        id: pending
        env:
          ARTICLE_AUDIO_PYTHON: python
        run: |
          python -m pip install beautifulsoup4==4.15.0
          if npm run audio:check; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore model and paragraph cache
        id: audio-cache
        if: steps.pending.outputs.needed == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            outputs/audio-cache/models
            outputs/audio-cache/kokoro
            outputs/audio-cache/chunks
          key: article-audio-${{ runner.os }}-${{ hashFiles('scripts/article-audio.json', 'scripts/audio-requirements.txt') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            article-audio-${{ runner.os }}-${{ hashFiles('scripts/article-audio.json', 'scripts/audio-requirements.txt') }}-
            article-audio-${{ runner.os }}-
      - name: Install generator dependencies
        if: steps.pending.outputs.needed == 'true'
        run: |
          npm ci --ignore-scripts
          python -m pip install -r scripts/audio-requirements.txt
      - name: Generate, validate, and save recordings
        if: steps.pending.outputs.needed == 'true'
        timeout-minutes: 300
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONIOENCODING: utf-8
          ARTICLE_AUDIO_PYTHON: python
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            npm run audio -- --workers 2 --threads 2
            npm run audio:check
            node --check assets/js/article-audio.js
            node --check assets/js/site.js
            node scripts/build-english.mjs
            node scripts/check-seo.mjs
            git add -- assets/audio
            if git diff --cached --quiet; then exit 0; fi
            git diff --cached --check
            git commit -m "Update article recordings"
            if git push origin HEAD:main; then
              gh workflow run static.yml --ref main
              exit 0
            fi
            git pull --rebase origin main
          done
          echo "Main changed repeatedly. Run this workflow again."
          exit 1
      - name: Save completed and partial paragraphs
        if: always() && steps.pending.outputs.needed == 'true' && steps.audio-cache.outcome == 'success'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            outputs/audio-cache/models
            outputs/audio-cache/kokoro
            outputs/audio-cache/chunks
          key: ${{ steps.audio-cache.outputs.cache-primary-key }}
