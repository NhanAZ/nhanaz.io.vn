name: Auto-merge Dependabot updates

on:
  workflow_run:
    workflows: ["Validate static content"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    name: Merge verified Dependabot update
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge only Dependabot pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          author="$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json author --jq '.author.login')"
          state="$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json state --jq '.state')"
          draft="$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json isDraft --jq '.isDraft')"

          if [ "$author" != "dependabot[bot]" ]; then
            echo "The pull request is not authored by Dependabot. Skipping."
            exit 0
          fi

          if [ "$state" != "OPEN" ] || [ "$draft" = "true" ]; then
            echo "The pull request is not mergeable yet. Skipping."
            exit 0
          fi

          gh pr merge "$PR_NUMBER" \
            --repo "$REPOSITORY" \
            --auto \
            --squash \
            --delete-branch
