name: Validate static content

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "static-${{ github.event.pull_request.number || 'production' }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Validate static content
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate JavaScript
        run: node --check assets/js/site.js && node --check assets/js/theme.js && node --check assets/js/article-audio.js && node --check scripts/article-audio.mjs && node --check scripts/serve.mjs && node --check scripts/build-english.mjs && node --check scripts/check-seo.mjs
      - name: Validate audio playlist logic
        run: node --test scripts/article-audio.test.mjs
      - name: Setup Python for audio checks
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate recordings against articles
        run: |
          python -m pip install beautifulsoup4==4.15.0
          python -m unittest discover -s scripts -p 'test_article_audio.py'
          npm run audio:check
      - name: Validate Vietnamese-English pages
        run: node scripts/build-english.mjs
      - name: Validate SEO metadata
        run: node scripts/check-seo.mjs
